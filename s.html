<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banana Vibes</title>

  <!-- Open Graph (Facebook, WhatsApp, etc.) -->
  <meta property="og:title" content="Banana Vibes" />
  <meta property="og:description" content="Enjoy the tropical freshness of bananas!" />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg" />
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Banana Vibes" />
  <meta name="twitter:description" content="Enjoy the tropical freshness of bananas!" />
  <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      flex: 2;
      position: relative;
      background-color: black;
    }
    .bottom {
      flex: 3;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      color: white;
      font-family: sans-serif;
    }
    .left-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .progress-bar {
      flex-grow: 1;
      height: 5px;
      background: #444;
      border-radius: 2px;
      margin: 0 10px;
      cursor: pointer;
      position: relative;
    }
    .progress {
      height: 100%;
      background: #fff;
      width: 0%;
      border-radius: 2px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <video id="video" autoplay muted loop src="https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4"></video>
      <div class="controls">
        <div class="left-controls">
          <button id="playPause">⏸</button>
          <button id="muteUnmute">🔇</button>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress" id="progress"></div>
        </div>
        <div class="right-controls">
          <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
        </div>
      </div>
    </div>
    <div class="bottom">
      <iframe src="https://clk.kim/8R44Ibn"></iframe>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const playPauseBtn = document.getElementById("playPause");
    const muteUnmuteBtn = document.getElementById("muteUnmute");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const progressBar = document.getElementById("progressBar");
    const progress = document.getElementById("progress");

    muteUnmuteBtn.textContent = video.muted ? "🔇" : "🔊";

    playPauseBtn.addEventListener("click", () => {
      if (video.paused) {
        video.play();
        playPauseBtn.textContent = "⏸";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶️";
      }
    });

    muteUnmuteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteUnmuteBtn.textContent = video.muted ? "🔇" : "🔊";
    });

    video.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(video.duration);
    });

    video.addEventListener("timeupdate", () => {
      currentTimeEl.textContent = formatTime(video.currentTime);
      const percent = (video.currentTime / video.duration) * 100;
      progress.style.width = percent + "%";
    });

    progressBar.addEventListener("click", (e) => {
      const rect = progressBar.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      video.currentTime = percent * video.duration;
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? "0" + sec : sec}`;
    }
  </script>
</body>
        </html>
